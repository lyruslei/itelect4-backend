# GitHub runs every .yml file in .github/workflows/ when its "on" event
# happens. This one runs on every push, to any branch.
name: CI

on: push

jobs:
  test:
    # A fresh Linux machine: no node_modules, no .env, nothing from a laptop.
    runs-on: ubuntu-latest

    steps:
      # Copies the repo, at the pushed commit, onto the machine.
      - uses: actions/checkout@v7

      # Node 24, with npm's download cache kept between runs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Installs exactly what package-lock.json lists.
      - run: npm ci

      # The same check npm run build does, without writing dist/.
      - run: npm run typecheck

      # The Supertest file. requireAuth and the test both read JWT_SECRET,
      # and .env is not in the repo, so it comes from the repo's
      # Settings > Secrets and variables > Actions.
      - run: npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
